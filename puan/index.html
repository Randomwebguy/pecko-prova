<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F5EF">
<link rel="icon" href="../simge.svg" type="image/svg+xml">
<title>Üyeliğim · Peçko Fırın</title>
<link rel="stylesheet" href="../uygulama.css">
</head>
<body>
<header class="urlbar">🔒 <b>peckofirin.com.tr</b><span id="path">/sadakat/uye</span><a href="../">Kapat</a></header>

<div class="uygulama sekmeli">
  <header class="ust">
    <div class="marka-cubugu">
      <p class="marka"><span class="im" id="marka-im"></span>Peçko Fırın</p>
      <span id="ust-eylem"></span>
    </div>
    <h1 id="baslik">Kartım</h1>
    <p class="alt" id="alt"></p>
  </header>
  <main>

    <!-- giriş -->
    <section id="giris" hidden>
      <div class="secim">
        <a class="acik" href="#">Giriş</a>
        <a href="../onay/?yeni=1">Yeni üyelik</a>
      </div>
      <div class="uyari hata" id="giris-hata" role="alert" hidden></div>
      <div id="sifresiz" hidden>
        <div class="uyari bilgi">Bu cihazdaki üyelik, uygulamanın önceki sürümünden kalmış:
          şifresi yok, bu yüzden giriş yapılamıyor.</div>
        <a class="dugme birincil genis" href="../onay/?yeni=1">Yeni üyelik başlat</a>
      </div>
      <form id="giris-form">
        <label class="alan"><span>TELEFON NUMARAN</span>
          <input type="tel" name="telefon" inputmode="tel" autocomplete="tel" placeholder="0532 123 45 67" maxlength="20"></label>
        <label class="alan"><span>ŞİFREN</span>
          <input type="password" name="sifre" autocomplete="current-password"></label>
        <button class="dugme birincil genis" type="submit">Giriş yap</button>
      </form>
      <p class="dipnot merkez">Girişin, sen çıkana kadar açık kalır.</p>
    </section>

    <section id="s-kart" hidden></section>
    <section id="s-gecmis" hidden></section>
    <section id="s-fis" hidden></section>
    <section id="s-hesap" hidden></section>

  </main>
</div>

<nav class="sekmeler" id="sekmeler" aria-label="Uygulama bölümleri" hidden></nav>

<script src="../ortak.js"></script>
<script src="../simgeler.js"></script>
<script src="uygulama.js"></script>
</body>
</html>
