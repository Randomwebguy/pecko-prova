<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#11353C">
<link rel="icon" href="simge.svg" type="image/svg+xml">
<title>Peçko Fırın · Sadakat</title>
<link rel="stylesheet" href="uygulama.css">
<link rel="stylesheet" href="giris.css">
</head>
<body class="acilis">
<!-- NFC etiketi bu adresi açar. Betik hemen doğru ekrana gönderir; aşağıdaki
     kart yalnızca betik çalışmazsa görünür, o yüzden elle bir düğmesi var. -->
<main class="acilis-kart">
  <span class="acilis-im" aria-hidden="true"><img src="simge.svg" alt="" width="46" height="46"></span>
  <h1>Peçko Fırın</h1>
  <p>Sadakat programı açılıyor…</p>
  <span class="acilis-donuyor" aria-hidden="true"></span>
  <a class="dugme birincil genis" id="git" href="onay/">Devam et</a>
  <p class="acilis-kucuk">Gerçek kurulumda kasadaki NFC etiketi bu sayfayı açar.
    Bu bir akış provasıdır; gerçek kayıt oluşmaz, SMS gönderilmez.</p>
</main>
<script src="ortak.js"></script>
<script>
(function () {
  // v2: etiket ara ekran açmaz. İlk kez gelen kayıt akışına, oturumu açık
  // olan doğrudan kartına düşer; tanıtımı bitirmemiş olan tanıtıma.
  var P = window.PECKO;
  var q = new URLSearchParams(location.search);
  var token = (q.get('nokta') || 'KASA1').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 20) || 'KASA1';
  var s = P.load();
  s.token = token;
  P.save(s);
  var hedef = (s.status === 'active' && s.code && s.oturum !== false)
    ? (s.onboarded ? 'puan/' : 'tanitim/')
    : 'onay/?nokta=' + encodeURIComponent(token);
  document.getElementById('git').setAttribute('href', hedef);
  location.replace(hedef);
})();
</script>
</body>
</html>
